<script type="module">

/* ============================================================

   One night, one walk, one verb: look.

   ============================================================ */

function lakeK(x,z){ return sstep(-LAKE.w-6,-LAKE.w+2,x)*(1-sstep(LAKE.w-2,LAKE.w+6,x))*sstep(LAKE.z1-5,LAKE.z1+3,z)*(1-sstep(LAKE.z0-3,LAKE.z0+5,z)); }

{ const L=[]; for(let i=0;i<520;i++){ const x=(rnd()*2-1)*95, z=12-rnd()*70; const pn=pathNear(x,z); if(pn.d<4.5||Math.hypot(x-1.8,z-1.2)<6) continue; L.push([x,z,0.8+rnd()*0.9]); }

/* ---------- the fire you wake beside ---------- */
const FIRE = new THREE.Vector3(1.6,0,1.4); FIRE.y=groundH(FIRE.x,FIRE.z);
const fire = new THREE.Group(); fire.position.copy(FIRE); world.add(fire);
for(let i=0;i<5;i++){ const l=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,0.9,5),lam(0x3a2418)); l.rotation.set(Math.PI/2-0.35,i*1.25,0); l.position.y=0.12; fire.add(l); }

const lakeU = {uT:{value:0}, uFreeze:{value:0}, uFire:{value:new THREE.Vector3(9,-4,-112)}, uLook:{value:0}};
{ const g=new THREE.PlaneGeometry(LAKE.w*2+14,(LAKE.z0-LAKE.z1)+12,1,1); g.rotateX(-Math.PI/2); g.translate(0,0,(LAKE.z0+LAKE.z1)/2);

const N=(m)=>440*Math.pow(2,(m-69)/12);
function motif(major){ if(!A.on) return; const t=A.C.currentTime+0.05, seq=major?[72,76,79,76,84]:[69,72,76,74]; seq.forEach((m,i)=>tone(N(m),t+i*0.42,2.4,0.05,'triangle',0.5)); }
function chord(){ if(!A.on) return; const t=A.C.currentTime; [48,55,64,71,76].forEach((m,i)=>{ const C=A.C, o=C.createOscillator(), g=C.createGain(); o.type='sine'; o.frequency.value=N(m); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.03,t+6+i); g.gain.linearRampToValueAtTime(0.0001,t+26); o.connect(g); g.connect(A.master); o.start(t); o.stop(t+27); }); }

/* ---------- input: left side walks, right side looks; keys, mouse and pads too ---------- */
const P={x:0,z:4.5,y:0,yaw:0,pitch:-0.05,vx:0,vz:0,bob:0,step:0};
const keys={}; addEventListener('keydown',e=>{ keys[e.code]=1; }); addEventListener('keyup',e=>{ keys[e.code]=0; });
const stick={id:null,x0:0,y0:0,x:0,y:0}, look={id:null,x:0,y:0};
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{ if(!G.started) return; if(e.pointerType==='mouse'){ if(document.pointerLockElement!==cv) cv.requestPointerLock?.(); return; }
  if(e.clientX<innerWidth*0.45&&stick.id===null){ stick.id=e.pointerId; stick.x0=e.clientX; stick.y0=e.clientY; stick.x=stick.y=0; } else if(look.id===null){ look.id=e.pointerId; look.x=e.clientX; look.y=e.clientY; } });
addEventListener('pointermove',e=>{ if(e.pointerId===stick.id){ const dx=e.clientX-stick.x0, dy=e.clientY-stick.y0, l=Math.hypot(dx,dy), m=Math.min(1,l/60); stick.x=l?dx/l*m:0; stick.y=l?dy/l*m:0; }
  else if(e.pointerId===look.id){ P.yaw-=(e.clientX-look.x)*0.0058; P.pitch=clamp(P.pitch-(e.clientY-look.y)*0.0048,-1.25,1.1); look.x=e.clientX; look.y=e.clientY; }
  else if(document.pointerLockElement===cv){ P.yaw-=e.movementX*0.0024; P.pitch=clamp(P.pitch-e.movementY*0.0022,-1.25,1.1); } });
const up=e=>{ if(e.pointerId===stick.id){ stick.id=null; stick.x=stick.y=0; } if(e.pointerId===look.id) look.id=null; }; addEventListener('pointerup',up); addEventListener('pointercancel',up);
function padRead(){ const gp=navigator.getGamepads?[...navigator.getGamepads()].find(g=>g&&g.connected):null; if(!gp) return null; const dz=v=>Math.abs(v)<0.15?0:v; return {mx:dz(gp.axes[0]),my:dz(gp.axes[1]),lx:dz(gp.axes[2]),ly:dz(gp.axes[3])}; }

/* ---------- the story, one beat at a time ---------- */
const G={started:false,t:0,beat:'wake',bt:0,gaze:0,freeze:0,frozen:false,lookDown:0,inside:false,f:{},still:0,steps:0,stepsSaid:0,end:false};
const fadeEl=$('fade'), arc=$('arc'), gazeEl=$('gaze');
const fwd=new THREE.Vector3(), tmp=new THREE.Vector3();
function lookingAt(p,deg){ camera.getWorldDirection(fwd); tmp.copy(p).sub(camera.position); const d=tmp.length(); tmp.normalize(); return {a:Math.acos(clamp(fwd.dot(tmp),-1,1))*57.3<deg, d}; }
function once(k){ if(G.f[k]) return false; G.f[k]=1; return true; }

function beatUpdate(dt){
  const b=G.beat; G.bt+=dt; const near=pathNear(P.x,P.z), s=near.s;
  // waking
  if(b==='wake'){ if(G.bt>2.5&&once('w1')) say('fox','Just you again. Up.'); if(G.bt>7&&once('w2')) say('fox',"There's a light. Over there, across the water. ...There's always a light.");
    if(s>18&&once('w3')) say('fox','I count, by the way. Steps. It helps.',{opt:true});
    if(s>S_SHORE-3){ G.beat='shore'; G.bt=0; } }
  // the shore: water or ice, it hasn't decided
  else if(b==='shore'){ if(once('s1')) say('fox',"Water. Or ice. It hasn't decided.");
    if(G.bt>4&&once('s2')) say('fox','Look at the light. Properly. It decides when you do.');
    const L=lookingAt(LAKE_W(),6); G.gaze=L.a&&G.bt>2?Math.min(1,G.gaze+dt/2.4):Math.max(0,G.gaze-dt*0.6);
    if(G.gaze>=1||G.bt>40){ const late=G.gaze<1; G.frozen=true; G.beat='lake'; G.bt=0; G.gaze=0; motif(false); burst(1.6,900,'bandpass',0.25,0.7); navigator.vibrate?.(60); say('fox',late?"...Fine. I'll decide. Ice.":"There. Ice. Don't thank me."); } }
  // the lake, and the other night under it
  else if(b==='lake'){ const over=zoneOf(P.z)==='lake', down=P.pitch<-0.55&&over;
    G.lookDown=down?Math.min(1,G.lookDown+dt/1.6):Math.max(0,G.lookDown-dt*0.5); lakeU.uLook.value=G.lookDown;
    if(G.lookDown>=1&&once('l1')){ say('him','Mind the stove. I might be late.'); say('fox',"Don't look down. That's the other night. It's still going, down there."); }
    if(s>S_SHORE+50&&!G.f.l1&&once('l0')) say('fox',"There's a fire under the ice. Don't look at it.",{opt:true});
    if(s>S_SHORE+70&&once('l2')) say('fox','Four hundred and twelve. Since the fire. I said I count.',{opt:true});
    if(s>S_LAKE_END){ G.beat='orchard'; G.bt=0; } }
  // the orchard: frost and blossom at once, his spoons, the deer
  else if(b==='orchard'){ if(once('o1')) say('fox',"An orchard. In frost. In flower. Both. Somebody couldn't decide.");
    if(G.f.spoon&&once('o2')) say('fox',"Spoons. He hung them so we'd hear the way. That's a clock. The only honest one.");
    if(deer.said===1&&once('o3')) say('fox',"A deer. Made of roots. It only watches. ...It's watching you be late.");
    if(s>S_HOUSE-14&&once('o4')) say('fox','The lamp. He left it on. ...He always leaves it on.');
    if(s>S_HOUSE){ G.beat='door'; G.bt=0; } }
  // the door: it opens if you mean it
  else if(b==='door'){ const L=lookingAt(DOOR_W,9); if(once('d1')) say('fox','Go on. Look at the door. It opens if you mean it.');
    G.gaze=L.a&&L.d<11?Math.min(1,G.gaze+dt/2.0):Math.max(0,G.gaze-dt*0.6);
    if(G.gaze>=1||G.bt>45){ G.beat='open'; G.bt=0; G.gaze=0; motif(true); say('fox',"In you go. I'll stay out here. I'll mind the dark."); } }
  else if(b==='open'){ door.rotation.y=-1.7*sstep(0,1.6,G.bt); doorLight.material.color.setRGB(1,0.81,0.54).multiplyScalar(1+0.3*Math.sin(G.t*3));
    if(G.bt>1.2&&Math.hypot(P.x-DOOR_W.x,P.z-DOOR_W.z)<2.8&&!G.inside){ G.beat='enter'; G.bt=0; fadeEl.style.transition='opacity 1.2s ease'; fadeEl.style.opacity=1; } }
  else if(b==='enter'){ if(G.bt>1.4&&!G.inside) goInside(); }
  // inside: soup, him, and the fox finally sleeping; then morning
  else if(b==='in'){ const t=G.bt;
    if(t>2.5&&once('i1')) say('him',"There you are. Sit. It's only soup.");
    if(t>9&&once('i2')){ say('fox','...I came in after all.'); }
    if(t>15&&once('i3')){ say('fox','Nothing came. ...Nothing ever came.'); say('fox','You did, though.'); }
    if(t>27&&once('i4')) say('him','Plenty of time? ...No. Enough, though.');
    if(t>34&&once('i5')) say('fox',"I'll mind the... ...No. Actually. I think I'll sleep.");
    if(t>44&&once('i6')){ chord(); }
    if(t>60&&once('i7')) say('him','Morning. ...Look at that.');
    if(t>68&&once('i8')){ say('nar','He is asleep. First time in years.'); }
    if(t>78&&once('i9')){ G.end=true; $('end').style.opacity=1; $('end').style.pointerEvents='auto'; fadeEl.style.transition='opacity 3s ease'; fadeEl.style.opacity=0.82; motif(true); } }
}
function LAKE_W(){ return LAMP_W; }

function goInside(){ G.inside=true; G.beat='in'; G.bt=0; world.visible=false; room.visible=true; scene.fog=null; hemi.intensity=0.15; moon.intensity=0.05; scene.background=new THREE.Color(0x120c08);
  P.yaw=0; P.pitch=-0.08; fadeEl.style.transition='opacity 2.4s ease'; setTimeout(()=>{ fadeEl.style.opacity=0; },300); }

/* ---------- the loop ---------- */
const clock=new THREE.Clock();
function frame(){ requestAnimationFrame(frame); const dt=Math.min(0.05,clock.getDelta()); G.t+=dt; const t=G.t;
  if(G.started&&!G.end) beatUpdate(dt); subsUpdate(dt);
  // move
  let mx=stick.x, mz=stick.y; if(keys.KeyW||keys.ArrowUp) mz-=1; if(keys.KeyS||keys.ArrowDown) mz+=1; if(keys.KeyA||keys.ArrowLeft) mx-=1; if(keys.KeyD||keys.ArrowRight) mx+=1;
  const pad=padRead(); if(pad){ mx+=pad.mx; mz+=pad.my; P.yaw-=pad.lx*dt*2.2; P.pitch=clamp(P.pitch-pad.ly*dt*1.6,-1.25,1.1); }
  const ml=Math.hypot(mx,mz); if(ml>1){ mx/=ml; mz/=ml; }
  if(!G.started||G.inside||G.beat==='enter'||G.beat==='wake'&&G.bt<2.2){ mx=mz=0; }
  const sp=2.5, fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw), rx=Math.cos(P.yaw), rz=-Math.sin(P.yaw);
  const tvx=(fx*-mz+rx*mx)*sp, tvz=(fz*-mz+rz*mx)*sp; P.vx=lerp(P.vx,tvx,Math.min(1,dt*8)); P.vz=lerp(P.vz,tvz,Math.min(1,dt*8));
  if(!G.inside){ let nx=P.x+P.vx*dt, nz=P.z+P.vz*dt; const n=pathNear(nx,nz); const W=zoneOf(nz)==='lake'?16:(zoneOf(nz)==='house'?5:8);
    if(n.d>W){ nx=n.px+n.nx*W; nz=n.pz+n.nz*W; }
    let lim=PLEN-0.4; if(!G.frozen) lim=S_SHORE; else if(G.beat!=='open'&&G.beat!=='enter') lim=PLEN-1.6;
    if(n.s>lim){ const q=pathAt(lim); const back=pathNear(nx,nz); nx-= (back.s-lim)*q.dx; nz-=(back.s-lim)*q.dz; }
    const moved=Math.hypot(nx-P.x,nz-P.z); P.x=nx; P.z=nz; const gh=zoneOf(P.z)==='lake'&&G.frozen?Math.max(0,groundH(P.x,P.z)):groundH(P.x,P.z);
    P.y=lerp(P.y||gh,gh,Math.min(1,dt*10)); P.bob+=moved*2.4; P.step+=moved;
    if(P.step>0.75){ P.step=0; const zo=zoneOf(P.z); if(zo==='lake') { burst(0.07,3200,'highpass',0.08); tone(1900+Math.random()*400,A.on?A.C.currentTime:0,0.12,0.006,'sine',0); } else burst(0.09,zo==='orchard'?1400:700,'lowpass',0.12); }
    G.still=moved<0.002?G.still+dt:0;
    let eyeY=P.y+1.62+Math.sin(P.bob)*0.035; if(G.beat==='wake') eyeY=P.y+lerp(0.5,1.62,sstep(0.4,2.4,G.bt));
    camera.position.set(P.x,eyeY,P.z); }
  else { camera.position.set(room.position.x,1.15,room.position.z+1.15); P.yaw=clamp(P.yaw,-1.4,1.4); }
  camera.rotation.set(P.pitch,P.yaw,0,'YXZ');
  // gaze ring
  const gz=G.gaze; arc.style.strokeDashoffset=(1-gz)*100; gazeEl.style.opacity=(G.beat==='shore'||G.beat==='door')&&G.started?(gz>0.02?0.95:0.45):(G.lookDown>0.02?0.8:0.0);
  if(G.lookDown>0.02&&G.beat==='lake') arc.style.strokeDashoffset=(1-G.lookDown)*100;
  // the fox: ahead on the path, waiting, looking back; sitting when you stop
  if(!G.inside){ const ps=pathNear(P.x,P.z).s; let ts=ps+5.5, lat=1.3; if(G.beat==='shore') ts=Math.min(ts,S_SHORE-1.5); if(G.beat==='door'||G.beat==='open'||G.beat==='enter'){ ts=PLEN-3; lat=-2.2; }
    const q=pathAt(ts), tx=q.x+q.dz*lat, tz=q.z-q.dx*lat, dx=tx-fox.g.position.x, dz=tz-fox.g.position.z, d=Math.hypot(dx,dz);
    const far=Math.hypot(P.x-fox.g.position.x,P.z-fox.g.position.z)>13; let v=0;
    if(d>0.4&&!far){ v=Math.min(3.4,d*1.4); fox.g.position.x+=dx/d*v*dt; fox.g.position.z+=dz/d*v*dt; fox.g.rotation.y=Math.atan2(dx,dz); }
    else { const want=Math.atan2(P.x-fox.g.position.x,P.z-fox.g.position.z); let dy=want-fox.g.rotation.y; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); fox.g.rotation.y+=dy*Math.min(1,dt*3); }
    fox.sit=lerp(fox.sit,(v<0.1&&(G.still>2.5||G.beat==='door'||G.beat==='open'))?1:0,Math.min(1,dt*3));
    const fy=zoneOf(fox.g.position.z)==='lake'&&G.frozen?0:groundH(fox.g.position.x,fox.g.position.z); fox.g.position.y=lerp(fox.g.position.y,fy,Math.min(1,dt*10)); foxPose(fox,dt,v,t); }
  // world life
  if(world.visible){
    flames.forEach((f,i)=>{ const k=0.75+0.25*Math.sin(t*(9+i*2.3)+i)*Math.sin(t*(5.3+i)); f.scale.setScalar((0.9-i*0.1)*k); f.position.x=Math.sin(t*3+i)*0.04; });
    fireLight.intensity=5.2+1.4*Math.sin(t*11)*Math.sin(t*7.3); fireHalo.material.opacity=0.3+0.06*Math.sin(t*9);
    mists.forEach((m,i)=>{ m.m.position.x=m.x0+Math.sin(t*0.05*m.v+i)*6; });
    lakeU.uT.value=t; if(G.frozen) G.freeze=Math.min(1,G.freeze+dt/5); lakeU.uFreeze.value=sstep(0,1,G.freeze);
    const pp=petals.pos; for(let i=0;i<petals.n;i++){ let y=pp[i*3+1]-dt*(0.25+0.15*Math.sin(petals.ph[i])); if(y<0.6) y=6.8; pp[i*3+1]=y; pp[i*3]+=Math.sin(t*0.7+petals.ph[i])*dt*0.25; } petals.p.geometry.attributes.position.needsUpdate=true;
    spoons.forEach((sp,i)=>{ const dd=Math.hypot(P.x-sp.m.position.x,P.z-sp.m.position.z); sp.m.rotation.z=0.12*Math.sin(t*1.7+sp.ph); sp.m.rotation.x=0.08*Math.sin(t*1.3+sp.ph*2);
      if(dd<2.6&&!sp.rung){ sp.rung=1; G.f.spoon=1; const f=[1568,1760,2093,2349][i%4]; if(A.on){ tone(f,A.C.currentTime,1.6,0.03,'sine',0.3); tone(f*2.76,A.C.currentTime,0.5,0.008,'sine',0); } } if(dd>6) sp.rung=0; });
    // the deer: only ever where you aren't looking, until you are
    if(G.beat==='orchard'||G.beat==='lake'&&pathNear(P.x,P.z).s>S_LAKE_END-6){ const D=deer.g, L=lookingAt(D.position.clone().setY(D.position.y+2),24), vis=D.visible&&L.a&&L.d<46;
      if(!D.visible||(!L.a&&deer.seen>2.5&&(deer.away+=dt)>2)){ const ps=pathNear(P.x,P.z).s+22+rnd()*12, q=pathAt(Math.min(ps,S_HOUSE-6)), side=rnd()<0.5?-1:1; const x=q.x+q.dz*side*(11+rnd()*5), z=q.z-q.dx*side*(11+rnd()*5);
        tmp.set(x,groundH(x,z)+2,z); if(!lookingAt(tmp,40).a){ D.position.set(x,groundH(x,z),z); D.rotation.y=Math.atan2(P.x-x,P.z-z); D.visible=true; deer.seen=0; deer.away=0; } }
      if(vis){ deer.seen+=dt; deer.away=0; if(deer.seen>1.4&&!deer.said) deer.said=1; } }
    else if(G.beat!=='orchard') deer.g.visible=false;
    smoke.forEach(s=>{ s.t=(s.t+dt*0.06)%1; s.s.position.set(2.4+s.t*1.4+Math.sin(t*0.5+s.t*4)*0.3,7.6+s.t*5,-1.2+s.t*0.6); s.s.scale.setScalar(1.2+s.t*3.2); s.s.material.opacity=0.22*Math.sin(Math.PI*s.t); });
    { const bd=camera.position.distanceTo(LAMP_W), far=Math.max(1,bd/45); beacon.material.opacity=0.75+0.1*Math.sin(t*1.3); beacon.scale.setScalar(16*Math.max(1,far*0.55)); beaconCore.scale.setScalar((3.2+0.25*Math.sin(t*2.1))*Math.max(1,far*0.6)*(1+(G.beat==='shore'?G.gaze*0.8:0))); }
  }
  if(room.visible){ const T=G.bt;
    // him: breathing, nodding now and then
    oldMan.userData.head.rotation.x=0.08*Math.sin(t*0.6); oldMan.scale.y=1+0.008*Math.sin(t*1.4);
    steamS.forEach((s,i)=>{ s.material.opacity=0.12+0.06*Math.sin(t*2+i); s.position.y=1.0+0.05*Math.sin(t*1.3+i); });
    stoveLight.intensity=3.2+0.8*Math.sin(t*9)*Math.sin(t*5.7);
    // the fox comes in and goes to the rug by the stove
    const F=roomFox, tg=T<9?null:new THREE.Vector3(2.0,0,0.45); let v=0; if(tg){ const dx=tg.x-F.g.position.x, dz=tg.z-F.g.position.z, d=Math.hypot(dx,dz); if(d>0.1){ v=Math.min(1.6,d*1.6); F.g.position.x+=dx/d*v*dt; F.g.position.z+=dz/d*v*dt; F.g.rotation.y=Math.atan2(dx,dz); } }
    F.lie=lerp(F.lie,T>36?1:0,Math.min(1,dt*0.8)); if(T>36) F.g.rotation.y=lerp(F.g.rotation.y,-0.6,Math.min(1,dt)); F.g.visible=T>8.5; foxPose(F,dt,v,t);
    // dawn
    const dawn=sstep(44,62,T); roomU.uDawn.value=dawn; roomLamp.material.opacity=0.95*(1-dawn*0.85); roomHemi.intensity=0.5+0.9*dawn; roomHemi.color.setRGB(0.42+0.5*dawn,0.35+0.4*dawn,0.31+0.25*dawn);
  }
  // sound beds
  if(A.on){ const C=A.C, n=C.currentTime, zo=zoneOf(P.z), fd=Math.hypot(P.x-FIRE.x,P.z-FIRE.z);
    A.wind.g.gain.setTargetAtTime(G.inside?0:0.05+0.03*Math.sin(t*0.13),n,0.5); A.wind.fl.frequency.setTargetAtTime(380+180*Math.sin(t*0.07),n,0.5);
    A.room.g.gain.setTargetAtTime(G.inside?0.05:0,n,0.8); A.hum.forEach((g,i)=>g.gain.setTargetAtTime(!G.inside&&zo==='lake'?0.018/(i+1):0,n,1.2));
    if(!G.inside&&fd<14&&Math.random()<dt*14) burst(0.03+Math.random()*0.04,2500+Math.random()*2000,'highpass',0.12*(1-fd/14));
    if(G.inside&&Math.random()<dt*6) burst(0.03,2000+Math.random()*1500,'highpass',0.03);
    if(!G.inside&&zo==='orchard'){ G.tk=(G.tk||0)+dt; if(G.tk>1){ G.tk=0; burst(0.012,3200,'bandpass',0.05,4); } } }
  renderer.render(scene,camera);
}

/* ---------- start ---------- */
$('hint').textContent=MOBILE?'left thumb to walk · right thumb to look · headphones, if you have them':'W A S D to walk · mouse to look · headphones, if you have them';
$('go').textContent='tap to begin';
$('title').addEventListener('click',()=>{ if(G.started) return; G.started=true; audioStart(); $('title').style.opacity=0; setTimeout(()=>$('title').remove(),2100);
  fadeEl.style.opacity=0; say('nar','You fell asleep by the fire.'); });
renderer.compile(scene,camera); fadeEl.style.opacity=0.0; fadeEl.style.opacity=1;
P.y=groundH(P.x,P.z); camera.position.set(P.x,P.y+0.5,P.z); camera.rotation.set(P.pitch,P.yaw,0,'YXZ');
frame();
window.__short={G,P,go:(beat,s)=>{ const q=pathAt(s); P.x=q.x; P.z=q.z; P.yaw=Math.atan2(-q.dx,-q.dz); G.beat=beat; G.bt=0; if(beat!=='wake'&&beat!=='shore'){ G.frozen=true; G.freeze=1; } if(beat==='in') goInside(); }, S:{S_SHORE,S_LAKE_END,S_HOUSE,PLEN}};
</script>
